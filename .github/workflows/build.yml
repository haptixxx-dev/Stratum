name: Build Stratum

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

# A new push to the same ref supersedes the one in flight. Tags are never
# cancelled: a cancelled tag build means a release with no artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # TEST - fast Linux gate. Runs the suite via the `ci` preset, which turns
  # Tracy and pybind11 off; neither is exercised by the tests and pybind11
  # needs Python dev headers. This is the job that gates a PR.
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libexpat1-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdrm-dev libgbm-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-jackd2-dev \
            libsndio-dev libdecor-0-dev libudev-dev libdbus-1-dev libfribidi-dev \
            libthai-dev libunwind-dev libvulkan-dev \
            mesa-vulkan-drivers vulkan-tools

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: tests-linux

      - name: Configure
        env:
          STRATUM_LAUNCHER: ccache
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      # The GPU suites have never actually run. They skip themselves when
      # SDL_CreateGPUDevice() finds no backend, and no runner has a GPU, so 123
      # tests have only ever reported "skipped" in this project's history.
      #
      # mesa-vulkan-drivers brings lavapipe, a software Vulkan device, and the
      # offscreen video driver lets SDL bring its video subsystem up with no
      # display -- SDL_CreateGPUDevice() returns "Video subsystem not
      # initialized" otherwise, which reads like a missing GPU and is not.
      #
      # This cannot make CI worse. If lavapipe does not give SDL_GPU a usable
      # backend, the suites skip exactly as they already do. If it does, 123
      # tests start asserting something.
      - name: Test
        env:
          SDL_VIDEODRIVER: offscreen
        run: ctest --preset ci

      # ctest hides a test's stdout unless it fails, so its summary cannot say
      # whether the GPU suites ran or skipped -- both report success. Run the
      # binary directly for the one line that distinguishes them:
      #
      #   "123 passed, 0 failed"              lavapipe gives SDL_GPU a backend
      #   "91 passed, 0 failed, 32 skipped"   it does not, and 32 tests are dead
      #
      # Only 32 of the 123 need a device; the other 91 are CPU-side logic that
      # happens to live in the GPU binary.
      - name: Report GPU backend and whether the suites ran
        if: always()
        # The SAME environment as the Test step above. Without this the step
        # measures a different world from the one it is meant to diagnose: the
        # first version lacked SDL_VIDEODRIVER and reported "SDL video init
        # failed: No available video device", which says nothing about whether
        # lavapipe works and everything about the missing variable.
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          echo "--- vulkaninfo ---"
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverName" || \
            echo "no Vulkan device visible"
          echo "--- SDL_VIDEODRIVER=${SDL_VIDEODRIVER:-unset} ---"
          echo "--- stratum_gpu_tests ---"
          # stderr is NOT discarded here, deliberately. The suites print their
          # skip reason -- the string SDL_GetError() returned when
          # SDL_CreateGPUDevice() refused -- to stderr, and the first version of
          # this step sent it to /dev/null. So the log showed "32 skipped" with
          # no way to find out why, which is half a diagnostic.
          ./build/ci/bin/stratum_gpu_tests 2>&1 | grep -E "SKIPPED|passed," | head -5 || \
            echo "gpu test binary did not run"

  # ══════════════════════════════════════════════════════════════════════════
  # BUILD - three-platform release matrix, packaged for the release job.
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-dev zlib1g-dev libbz2-dev \
            libexpat1-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libx11-dev libxext-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxrender-dev \
            libxss-dev libxtst-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libjack-jackd2-dev libsndio-dev libdecor-0-dev \
            libudev-dev libdbus-1-dev libfribidi-dev libthai-dev libunwind-dev \
            libvulkan-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # libosmium needs zlib, bzip2 and expat, and external/CMakeLists.txt asks
      # for all three with find_package(... REQUIRED). Linux installs them from
      # apt and macOS has them in the SDK; the Windows runners ship none of
      # them, so configure got past the compiler check only to die on
      # "Could NOT find ZLIB". vcpkg is preinstalled on the runner image.
      - name: Install zlib, bzip2 and expat (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows bzip2:x64-windows expat:x64-windows

      # Ninja + cl needs the MSVC environment on PATH. Without this the
      # configure step fails with "CMAKE_CXX_COMPILER: cl is not a full path
      # and was not found in the PATH", which is what broke every Windows
      # build from August 2026 onward.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: build-${{ matrix.os }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Configure CMake (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -B "${{ steps.strings.outputs.build-output-dir }}"
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSTRATUM_ENABLE_TRACY=ON
          -DSTRATUM_ENABLE_PYTHON=ON
          -S "${{ github.workspace }}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-output-dir }}"
          -G Ninja
          -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DSTRATUM_ENABLE_TRACY=ON
          -DSTRATUM_ENABLE_PYTHON=ON
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --parallel

      - name: Package build (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "${{ steps.strings.outputs.build-output-dir }}/bin"
          tar -czf "${{ github.workspace }}/stratum-v${{ steps.strings.outputs.version }}-${{ matrix.os }}.tar.gz" *

      - name: Package build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.strings.outputs.build-output-dir }}/bin/*" -DestinationPath "${{ github.workspace }}/stratum-v${{ steps.strings.outputs.version }}-${{ matrix.os }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stratum-v${{ steps.strings.outputs.version }}-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/stratum-*.tar.gz
            ${{ github.workspace }}/stratum-*.zip
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # RELEASE - on a v* tag, once the tests pass and all three platforms build.
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The tag and the VERSION file must agree, or the release is named after
      # one and built from the other.
      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file)"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Stratum v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: release/*
